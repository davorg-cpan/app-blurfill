name: Publish Core Docker Image

on:
  push:
    tags:
      - 'RELEASE_*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for the Docker image'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set version from tag
        if: github.event_name == 'push'
        run: echo "VERSION=${GITHUB_REF#refs/tags/RELEASE_}" >> "$GITHUB_ENV"

      - name: Set version from manual input
        if: github.event_name == 'workflow_dispatch'
        run: echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: davorg
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push core image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            docker.io/davorg/app-blurfill:${{ env.VERSION }}
            docker.io/davorg/app-blurfill:latest
